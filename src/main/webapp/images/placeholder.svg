<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5F0"/>
      <stop offset="100%" stop-color="#EFE6DD"/>
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D9C3B0"/>
      <stop offset="50%" stop-color="#EAD9CB"/>
      <stop offset="100%" stop-color="#D0B8A3"/>
    </linearGradient>
    <linearGradient id="dropperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A3E3D"/>
      <stop offset="100%" stop-color="#2D2424"/>
    </linearGradient>
    <linearGradient id="jarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2D4C7"/>
      <stop offset="50%" stop-color="#F5ECE4"/>
      <stop offset="100%" stop-color="#D6C4B4"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#5A4A42" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative circles -->
  <circle cx="90" cy="80" r="45" fill="#E8DCD1" opacity="0.45"/>
  <circle cx="330" cy="220" r="60" fill="#E8DCD1" opacity="0.35"/>

  <!-- Serum Bottle & Dropper -->
  <g filter="url(#softShadow)">
    <!-- Dropper top rubber bulb -->
    <path d="M165,58 C165,48 175,44 185,44 C195,44 205,48 205,58 L205,68 L165,68 Z" fill="url(#dropperGrad)"/>
    <!-- Gold / metallic collar -->
    <rect x="160" y="68" width="50" height="12" rx="3" fill="#C5A880"/>
    <rect x="163" y="80" width="44" height="6" rx="2" fill="#B39266"/>
    <!-- Glass bottle body -->
    <rect x="150" y="86" width="70" height="130" rx="14" fill="url(#bottleGrad)"/>
    <!-- Bottle label -->
    <rect x="158" y="112" width="54" height="78" rx="4" fill="#FFFFFF" opacity="0.92"/>
    <line x1="168" y1="128" x2="202" y2="128" stroke="#8C7A6B" stroke-width="2" stroke-linecap="round"/>
    <line x1="172" y1="136" x2="198" y2="136" stroke="#C5A880" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="165" y1="152" x2="205" y2="152" stroke="#D9C3B0" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="169" y1="160" x2="201" y2="160" stroke="#D9C3B0" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Specular highlight -->
    <path d="M156,98 Q158,150 156,204" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Cream Jar -->
  <g filter="url(#softShadow)">
    <!-- Jar lid -->
    <rect x="230" y="160" width="85" height="16" rx="5" fill="#4A3E3D"/>
    <!-- Jar glass/ceramic body -->
    <path d="M234,176 L311,176 Q315,216 272.5,216 Q230,216 234,176 Z" fill="url(#jarGrad)"/>
    <!-- Jar label line -->
    <rect x="244" y="184" width="62" height="20" rx="3" fill="#FFFFFF" opacity="0.88"/>
    <line x1="254" y1="194" x2="296" y2="194" stroke="#8C7A6B" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Aesthetic botanical sprig -->
  <g stroke="#9C8775" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.65">
    <path d="M110,230 Q120,180 142,150"/>
    <path d="M125,195 Q115,188 120,178 Q130,185 125,195 Z" fill="#D5C5B5"/>
    <path d="M136,170 Q145,160 148,172 Q138,176 136,170 Z" fill="#D5C5B5"/>
  </g>
</svg>
